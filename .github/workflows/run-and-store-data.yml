name: Run pipeline and store data

on:
  push:
    branches:
      - main

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make run.sh executable and run it
        run: |
          chmod +x run.sh
          bash run.sh

      - name: Push output data to feature/data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save the generated data to a temp location
          mkdir -p /tmp/data-output
          cp -r ./data/. /tmp/data-output/

          # Switch to feature/data, creating it if it doesn't exist
          git fetch origin feature/data 2>/dev/null || true
          git checkout feature/data 2>/dev/null || git checkout --orphan feature/data

          # If we switched to an existing branch, clean it up
          # If orphan, the working tree is already clean
          git rm -rf . --quiet 2>/dev/null || true

          # Copy data back
          cp -r /tmp/data-output/. ./data/

          # Add a README so the branch purpose is clear
          cat <<EOF > README.md
          # feature/data

          This branch is auto-generated by the CI pipeline.
          It contains the output of \`run.sh\` triggered on every merge to \`main\`.

          **Do not edit this branch manually.**
          Last updated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          git add .

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to data — skipping commit."
          else
            git commit -m "chore(data): update pipeline output [$(date -u +"%Y-%m-%dT%H:%M:%SZ")]"
            git push origin feature/data
          fi